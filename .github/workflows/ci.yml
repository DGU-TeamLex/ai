name: ai-ci

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run offline test suite
        env:
          NEWS_PROVIDER: disabled
          COMMODITY_PROVIDER: disabled
          REQUIRE_EXTERNAL_SIGNALS: "0"
        run: python -m pytest -q
